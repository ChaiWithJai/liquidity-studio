# Reviewed opt-in overlay only. The callback is the owned Studio candidate on
# port39038; maintain no other backend/exporter/storage published ports.
# No service, image, network or volume is created by this overlay.
services:
  penpot-frontend:
    volumes:
      - ../../tools/penpot-private-ingress/server.conf:/etc/nginx/overrides/server.d/studio-private-assets.conf:ro
