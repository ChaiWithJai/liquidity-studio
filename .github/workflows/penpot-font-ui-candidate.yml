# Manual-only candidate build; activation is not dispatch or runtime deployment.
name: Penpot pinned font UI candidate
on:
  workflow_dispatch:
    inputs:
      recipient_public_key_base64:
        description: Operator RSA public PEM base64; private key remains local
        required: true
        type: string
      recipient_sha256:
        description: Independently verified recipient public SPKI DER SHA256
        required: true
        type: string
      confirmation:
        description: 'Exact reviewed source-only build authorization phrase'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: penpot-font-ui-candidate
  cancel-in-progress: false
jobs:
  build:
    if: inputs.confirmation == 'build-reviewed-penpot-font-ui-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      UPSTREAM_SHA: ff7a66f51938b2293260ea27a64e2c4e0833b5e3
      DEVENV: penpotapp/devenv@sha256:912d522803d94fa3e5c9f304088887a45fa6d90517751094f22a14a8754d2b37
      ORIGINAL_FRONTEND: penpotapp/frontend@sha256:2c7f4e840102e06bccf36b6a93fc3a030cc0bbba7e0125dec33197187dba8041
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: studio
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: penpot/penpot
          ref: ff7a66f51938b2293260ea27a64e2c4e0833b5e3
          persist-credentials: false
          path: upstream
      - name: Source and host admission
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_SHA"
          echo '923eb82925a265419a2a46c36b12fdcabc0922b4d209018b96e92407dfe79bd4  upstream/frontend/src/app/main/data/fonts.cljs' | sha256sum -c -
          echo '85879dc707f99e7e0cf9a014164f1bd3874fe1e015348158fca3feb0252dec16  studio/scripts/investigations/penpot-font-ui-repair/fonts.patch' | sha256sum -c -
          test "$(df --output=avail -B1 . | tail -1)" -ge 24000000000
          test "$(awk '/MemTotal/{print $2}' /proc/meminfo)" -ge 12000000
          mkdir -p evidence
          git -C upstream status --porcelain > evidence/upstream-before.status
          find upstream -name '*lock*' -type f -print0 | sort -z | xargs -0 sha256sum > evidence/locks.before.sha256
          git -C upstream apply --check ../studio/scripts/investigations/penpot-font-ui-repair/fonts.patch
          git -C upstream apply ../studio/scripts/investigations/penpot-font-ui-repair/fonts.patch
          python3 studio/tools/penpot-thumbnail-refresh/apply.py upstream > evidence/thumbnail-apply.json
          python3 studio/tools/penpot-studio-host/apply.py upstream > evidence/studio-host-apply.json
          git -C upstream diff -- frontend/src/app/main/data/fonts.cljs frontend/src/app/main/data/workspace/thumbnails.cljs frontend/src/app/main/ui/workspace/shapes/frame.cljs frontend/test/frontend_tests/data/workspace_thumbnails_test.cljs frontend/src/app/main/ui/workspace.cljs frontend/src/app/main/ui.cljs frontend/src/app/main/ui/auth.cljs frontend/test/frontend_tests/runner.cljs docker/images/files/nginx-entrypoint.sh > evidence/applied.patch
      - name: Resolve pinned official toolchain without building an image
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$DEVENV"
          docker image inspect "$DEVENV" > evidence/devenv-image.json
          # Record exact actual versions; mismatch fails, never silently upgrades.
          docker run --rm --network none --memory 512m --cpus 1 --entrypoint bash "$DEVENV" -lc '
            node --version; pnpm --version; java -version 2>&1; clojure -Sdescribe
            test "$(node --version)" = v24.22.0
            test "$(pnpm --version)" = 12.14.0
            java -version 2>&1 | grep -q "27\."
            clojure -Sdescribe | grep -q 1.12.5.1664
          ' > evidence/toolchain.txt
      - name: Prepare exact target pnpm through its official version manager
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review-tools/home review-tools/bin
          cp studio/scripts/investigations/penpot-font-ui-repair/pnpm-frozen.sh review-tools/bin/pnpm
          chmod 755 review-tools/bin/pnpm
          docker run --rm --memory 1g --memory-swap 1g --cpus 1 \
            --mount type=bind,src="$GITHUB_WORKSPACE/review-tools",dst=/review-tools \
            --mount type=bind,src="$GITHUB_WORKSPACE/studio/scripts/investigations/penpot-font-ui-repair",dst=/recipe,readonly \
            -e PNPM_HOME=/review-tools/home -w / --entrypoint bash "$DEVENV" \
            -lc '
              set -euo pipefail
              /opt/node/bin/pnpm self-update 12.5.1 --registry=https://registry.npmjs.org
              export PATH="$PNPM_HOME/bin:$PATH"
              bin_dir="$(/opt/node/bin/pnpm bin --global)"
              test "$bin_dir" = /review-tools/home/bin
              test -x "$bin_dir/pnpm"
              resolved="$(readlink -f "$bin_dir/pnpm")"
              case "$resolved" in /review-tools/home/*) ;; *) exit 1 ;; esac
              printf "%s\n" "$bin_dir/pnpm" > /review-tools/installed-pnpm.path
              printf "%s\n" "$resolved" > /review-tools/resolved-pnpm.path
              # Verify inside the same namespace: global symlinks may be absolute.
              python3 /recipe/verify-pnpm.py "$bin_dir/pnpm" > /review-tools/pnpm-integrity.json
              verified="$(cat /review-tools/verified-pnpm.path)"
              test "$("$verified" --version)" = 12.5.1
            ' 2>&1 | tee evidence/pnpm-manager.log
      - name: Preserve bounded pnpm setup diagnostics even on failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for name in pnpm-integrity.json installed-pnpm.path resolved-pnpm.path pnpm-diagnostic.json verified-pnpm.path verified-pnpm.sha256; do
            if [ -f "review-tools/$name" ]; then
              test "$(stat -c %s "review-tools/$name")" -le 65536
              cp "review-tools/$name" evidence/
            fi
          done
      - name: Official complete frontend build in bounded disposable runner container
        shell: bash
        run: |
          set -euo pipefail
          # Full official frontend script includes WASM, MCP/plugin and UI prerequisites.
          # No production credentials, runtime volume, deployment, account or application DB.
          docker run --rm --name penpot-font-ui-build --memory 8g --memory-swap 8g --cpus 4 \
            --mount type=bind,src="$GITHUB_WORKSPACE/upstream",dst=/work \
            --mount type=bind,src="$GITHUB_WORKSPACE/review-tools",dst=/review-tools,readonly \
            -w /work/frontend -e CI=true -e PNPM_HOME=/review-tools/home -e JAVA_TOOL_OPTIONS=-Xmx4096m \
            -e NODE_OPTIONS=--max-old-space-size=1536 \
            -e SHADOWCLJS_EXTRA_PARAMS='' --entrypoint bash "$DEVENV" \
            -lc 'export PATH=/review-tools/bin:$PATH; test "$(pnpm --version)" = 12.5.1; ./scripts/build 2.18.3 && clojure -M:dev:shadow-cljs compile test && node target/tests/test.js --focus frontend-tests.data.workspace-thumbnails-test && node target/tests/test.js --focus frontend-tests.studio-host-test' 2>&1 | tee evidence/build.log
          # The exact pnpm wrapper appends explicit --frozen-lockfile to every install/i call.
          # Preserve the independent post-build tracked-lock/dependency diff gate.
          git -C upstream diff --exit-code -- '**/*lock*' '**/deps.edn' '**/package.json'
          test -s upstream/frontend/target/dist/js/main.js
          test -s upstream/frontend/target/dist/js/main-dashboard.js
          test -s upstream/frontend/target/dist/js/shared.js
          test -s upstream/frontend/target/dist/js/libs.js
      - name: Preserve complete candidate graph, source and original-image comparison
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$ORIGINAL_FRONTEND"
          original_id=$(docker create "$ORIGINAL_FRONTEND")
          trap 'docker rm "$original_id" >/dev/null' EXIT
          mkdir -p evidence/original
          docker cp "$original_id:/var/www/app/." evidence/original/
          python3 studio/scripts/investigations/penpot-font-ui-repair/manifest.py \
            evidence/original upstream/frontend/target/dist evidence/assets.json
          cp studio/scripts/investigations/penpot-font-ui-repair/fonts.patch evidence/
          cp studio/scripts/investigations/penpot-font-ui-repair/README.md evidence/
          git -C upstream archive HEAD | gzip > evidence/upstream-source.tar.gz
          cp upstream/frontend/src/app/main/data/fonts.cljs evidence/fonts.modified.cljs
          cp upstream/frontend/src/app/main/data/workspace/thumbnails.cljs evidence/thumbnails.modified.cljs
          cp upstream/frontend/src/app/main/ui/workspace/shapes/frame.cljs evidence/frame.modified.cljs
          cp upstream/frontend/test/frontend_tests/data/workspace_thumbnails_test.cljs evidence/workspace_thumbnails_test.modified.cljs
          cp studio/tools/penpot-thumbnail-refresh/thumbnails.patch studio/tools/penpot-thumbnail-refresh/thumbnails-test.patch studio/tools/penpot-thumbnail-refresh/frame.patch evidence/
          cp studio/tools/penpot-thumbnail-refresh/source-manifest.json evidence/thumbnail-source-manifest.json
          cp studio/tools/penpot-thumbnail-refresh/README.md evidence/thumbnail-README.md
          cp upstream/frontend/src/app/main/ui/workspace.cljs evidence/workspace.modified.cljs
          cp upstream/frontend/src/app/main/studio_host.cljs evidence/studio_host.modified.cljs
          cp upstream/frontend/src/app/main/ui/studio_entry.cljs evidence/studio_entry.modified.cljs
          cp upstream/frontend/src/app/main/ui.cljs evidence/ui.modified.cljs
          cp upstream/frontend/src/app/main/ui/auth.cljs evidence/auth.modified.cljs
          cp upstream/frontend/test/frontend_tests/studio_host_test.cljs evidence/studio_host_test.modified.cljs
          cp upstream/frontend/test/frontend_tests/runner.cljs evidence/runner.modified.cljs
          cp upstream/docker/images/files/nginx-entrypoint.sh evidence/nginx-entrypoint.modified.sh
          cp studio/tools/penpot-studio-host/workspace.patch studio/tools/penpot-studio-host/entrypoint.patch studio/tools/penpot-studio-host/auth.patch studio/tools/penpot-studio-host/entry-guide.patch studio/tools/penpot-studio-host/runner.patch evidence/
          cp studio/tools/penpot-studio-host/source-manifest.json evidence/studio-host-source-manifest.json
          cp studio/tools/penpot-studio-host/README.md evidence/studio-host-README.md
          cp upstream/LICENSE evidence/UPSTREAM-LICENSE
          tar -C upstream/frontend/target/dist -czf evidence/frontend-complete-candidate.tar.gz .
          sha256sum evidence/*.gz evidence/*.patch evidence/*.cljs evidence/*.sh evidence/assets.json > evidence/artifact-hashes.txt
          rm -rf evidence/original
      - name: Encrypt complete native frontend delivery for the explicit operator
        env:
          NATIVE_RECIPIENT_PUBLIC_KEY_BASE64: ${{ inputs.recipient_public_key_base64 }}
          NATIVE_RECIPIENT_SHA256: ${{ inputs.recipient_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir encrypted-delivery
          tar -cf "$RUNNER_TEMP/penpot-delivery.tar" -C evidence .
          test "$(stat -c %s "$RUNNER_TEMP/penpot-delivery.tar")" -le 3221225472
          sha256sum "$RUNNER_TEMP/penpot-delivery.tar" | sed "s|$RUNNER_TEMP/||" > encrypted-delivery/plaintext-archive.sha256
          split -d -a 3 -b 268435456 "$RUNNER_TEMP/penpot-delivery.tar" "$RUNNER_TEMP/penpot.part-"
          for part in "$RUNNER_TEMP"/penpot.part-*; do
            name=$(basename "$part")
            node studio/liquidity-studio/scripts/native-artifact-envelope.mjs seal "$part" "encrypted-delivery/$name.enc" "encrypted-delivery/$name.envelope.json"
          done
          python3 - <<'PYINDEX'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP']);archive=root/'penpot-delivery.tar'
          digest=lambda p: hashlib.file_digest(p.open('rb'),'sha256').hexdigest()
          parts=sorted(root.glob('penpot.part-*'))
          assert 1<=len(parts)<=12
          entries=[]
          for i,p in enumerate(parts):
              assert p.name==f'penpot.part-{i:03d}' and p.is_file() and not p.is_symlink()
              assert 0<p.stat().st_size<=268435456
              entries.append({'index':i,'plaintextFile':p.name,'ciphertextFile':p.name+'.enc','envelopeFile':p.name+'.envelope.json','plaintextBytes':p.stat().st_size,'plaintextSha256':digest(p)})
          assert sum(x['plaintextBytes'] for x in entries)==archive.stat().st_size<=3221225472
          pathlib.Path('encrypted-delivery/delivery-index.json').write_text(json.dumps({'schemaVersion':1,'archiveName':'penpot-delivery.tar','archiveBytes':archive.stat().st_size,'archiveSha256':digest(archive),'partCount':len(entries),'parts':entries},indent=2)+'\n')
          PYINDEX
          printf 'Decrypt ONLY each ciphertextFile listed by delivery-index.json using its envelopeFile and the local operator private key. Verify every plaintextBytes/SHA; concatenate ONLY the listed plaintextFile values in numeric index order, with no wildcard. Verify archiveBytes/SHA before extracting. No image push or deployment.\n' > encrypted-delivery/README.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-penpot-frontend-candidate-${{ github.run_id }}
          path: encrypted-delivery/
          retention-days: 3
          if-no-files-found: error
