name: Penpot pinned native hook verification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Full reviewed Studio commit containing both C2 and C3 native tools'
        required: true
        type: string
      confirmation:
        description: 'verify-reviewed-penpot-native-hooks'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: penpot-native-hook-verification
  cancel-in-progress: false
jobs:
  verify:
    if: inputs.confirmation == 'verify-reviewed-penpot-native-hooks'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      UPSTREAM_SHA: ff7a66f51938b2293260ea27a64e2c4e0833b5e3
      DEVENV: penpotapp/devenv@sha256:912d522803d94fa3e5c9f304088887a45fa6d90517751094f22a14a8754d2b37
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: recipe
      - name: Validate immutable input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          path: studio
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: penpot/penpot
          ref: ff7a66f51938b2293260ea27a64e2c4e0833b5e3
          persist-credentials: false
          path: upstream
      - name: Source and hosted resource admission
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C studio rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_SHA"
          test -z "$(git -C upstream status --porcelain)"
          test "$(df --output=avail -B1 . | tail -1)" -ge 12000000000
          test "$(awk '/MemTotal/{print $2}' /proc/meminfo)" -ge 12000000
          mkdir -p evidence
          printf '%s\n' "$SOURCE_SHA" > evidence/studio-source-sha.txt
          git -C recipe rev-parse HEAD > evidence/recipe-source-sha.txt
          printf '%s\n' "$UPSTREAM_SHA" > evidence/upstream-source-sha.txt
          sha256sum upstream/backend/deps.edn upstream/common/deps.edn upstream/backend/tests.edn > evidence/dependencies.before.sha256
          cp recipe/tools/penpot-native-hook-verification/kaocha.edn evidence/focused-kaocha.edn
          find studio/tools/penpot-brand-access studio/tools/penpot-live-fence -type f -print0 | sort -z | xargs -0 sha256sum > evidence/hook-inputs.sha256
      - name: Pinned official Clojure toolchain
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$DEVENV"
          docker image inspect "$DEVENV" > evidence/devenv-image.json
          docker run --rm --network none --memory 512m --memory-swap 512m --cpus 1 --entrypoint bash "$DEVENV" -lc '
            set -euo pipefail
            id
            java -version 2>&1
            clojure -Sdescribe
            java -version 2>&1 | grep -q "27\."
            clojure -Sdescribe | grep -q 1.12.5.1664
          ' > evidence/toolchain.txt
      - name: Apply and compile exact native hooks; run focused Clojure checks
        shell: bash
        run: |
          set -euo pipefail
          name="penpot-native-hook-verify-$GITHUB_RUN_ID"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          # Official UID/HOME stay unchanged. The cap-dropped container receives
          # only the checkout owner's group access to these disposable mounts.
          printf '%s\n' "$(id -u):$(id -g)" > evidence/host-checkout-owner.txt
          chmod -R g+rwX upstream evidence
          timeout --signal=TERM --kill-after=30s 45m docker run --rm --name "$name" \
            --memory 8g --memory-swap 8g --cpus 4 --cap-drop ALL --security-opt no-new-privileges \
            --group-add "$(id -g)" \
            --mount type=bind,src="$GITHUB_WORKSPACE/upstream",dst=/work \
            --mount type=bind,src="$GITHUB_WORKSPACE/studio/tools",dst=/hooks,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/recipe/tools/penpot-native-hook-verification",dst=/recipe,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/evidence",dst=/evidence \
            -w /work -e JAVA_TOOL_OPTIONS=-Xmx4096m -e CI=true --entrypoint bash "$DEVENV" \
            /recipe/verify.sh 2>&1 | tee evidence/native-verification.log
      - name: Preserve dependency and source delta evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C upstream diff --stat > evidence/upstream-diff.stat
          git -C upstream diff > evidence/applied-upstream.patch
          git -C upstream status --porcelain > evidence/upstream-after.status
          sha256sum -c evidence/dependencies.before.sha256
          git -C upstream diff --exit-code -- '**/deps.edn' '**/*lock*' '**/package.json'
          installed=()
          for directory in upstream/backend/src/app/studio upstream/backend/test/app/studio; do
            if [ -d "$directory" ]; then installed+=("$directory"); fi
          done
          : > evidence/installed-original-hook-sources.sha256
          if [ "${#installed[@]}" -gt 0 ]; then
            find "${installed[@]}" -type f -print0 | sort -z | xargs -0 -r sha256sum > evidence/installed-original-hook-sources.sha256
          fi
      - name: Record bounded verification manifest
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('evidence')
          root.mkdir(exist_ok=True)
          files = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.is_symlink():
                  continue
              size = path.stat().st_size
              if size > 32 * 1024 * 1024:
                  raise SystemExit('Evidence file exceeds 32 MiB bound')
              files.append({'path': str(path.relative_to(root)), 'bytes': size,
                            'sha256': hashlib.sha256(path.read_bytes()).hexdigest()})
          result = {'schemaVersion': 1, 'studioSourceSha': os.environ['SOURCE_SHA'],
                    'upstreamSourceSha': os.environ['UPSTREAM_SHA'],
                    'officialDevenv': os.environ['DEVENV'],
                    'namespaceAndFocusedTestsCompleted': (root / 'verification-complete.txt').is_file(),
                    'nativeRuntimeActivated': False, 'files': files}
          (root / 'manifest.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: penpot-native-hook-verification-${{ github.run_id }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
