name: Penpot reviewed backend candidate artifact
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Full reviewed Studio source already verified by the native-hook workflow'
        required: true
        type: string
      verification_run:
        description: 'Successful native-hook verification run ID for exactly source_sha'
        required: true
        type: string
      confirmation:
        description: 'build-reviewed-penpot-backend-candidate'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: penpot-backend-candidate-artifact
  cancel-in-progress: false
jobs:
  jar:
    if: inputs.confirmation == 'build-reviewed-penpot-backend-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERIFY_RUN: ${{ inputs.verification_run }}
      DEVENV: penpotapp/devenv@sha256:912d522803d94fa3e5c9f304088887a45fa6d90517751094f22a14a8754d2b37
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: recipe
      - name: Validate immutable input
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$VERIFY_RUN" =~ ^[1-9][0-9]{0,19}$ ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          path: studio
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: penpot/penpot
          ref: ff7a66f51938b2293260ea27a64e2c4e0833b5e3
          persist-credentials: false
          path: upstream
      - name: Require existing exact-source successful verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p admission/proof output
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFY_RUN" > admission/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFY_RUN/artifacts" > admission/artifacts.json
          python3 - <<'PY'
          import json, os
          values=json.load(open('admission/artifacts.json'))['artifacts']
          selected=[a for a in values if a['name']=='penpot-native-hook-verification-'+os.environ['VERIFY_RUN'] and not a['expired']]
          assert len(selected)==1 and 0 < selected[0]['size_in_bytes'] <= 64*1024*1024, 'Missing or unbounded verification artifact'
          PY
          gh run download "$VERIFY_RUN" --repo "$GITHUB_REPOSITORY" --name "penpot-native-hook-verification-$VERIFY_RUN" --dir admission/proof
          python3 recipe/tools/penpot-backend-candidate/verify-proof.py admission > output/verification-admission.json
      - name: Hosted source and resource admission
        run: |
          set -euo pipefail
          test "$(git -C studio rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(df --output=avail -B1 . | tail -1)" -ge 12000000000
          test "$(awk '/MemTotal/{print $2}' /proc/meminfo)" -ge 12000000
          git -C recipe rev-parse HEAD > output/recipe-source.txt
          printf '%s\n' "$SOURCE_SHA" > output/studio-source.txt
          sha256sum upstream/backend/deps.edn upstream/common/deps.edn > output/dependencies-before.sha256
          cp admission/proof/manifest.json output/verification-manifest.json
          cp admission/run.json output/verification-run.json
      - name: Construct production-basis JAR without rerunning tests
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$DEVENV"
          docker image inspect "$DEVENV" > output/toolchain-image.json
          chmod -R g+rwX upstream output
          name="penpot-candidate-jar-$GITHUB_RUN_ID"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          timeout --signal=TERM --kill-after=30s 25m docker run --rm --name "$name" \
            --memory 8g --memory-swap 8g --cpus 4 --cap-drop ALL --security-opt no-new-privileges \
            --group-add "$(id -g)" \
            --mount type=bind,src="$GITHUB_WORKSPACE/upstream",dst=/work \
            --mount type=bind,src="$GITHUB_WORKSPACE/studio/tools",dst=/hooks,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/recipe/tools/penpot-backend-candidate",dst=/recipe,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/output",dst=/output \
            -w /work -e JAVA_TOOL_OPTIONS=-Xmx4096m -e CI=true --entrypoint bash "$DEVENV" /recipe/build-jar.sh \
            2>&1 | tee output/jar-build.log
          sha256sum -c output/dependencies-before.sha256
          git -C upstream diff --exit-code -- '**/deps.edn' '**/*lock*' '**/package.json'
          sha256sum output/penpot.jar output/corresponding-source.tar.gz > output/artifact-hashes.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: penpot-backend-jar-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: error
  arm64-candidate:
    needs: jar
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      BASE: penpotapp/backend@sha256:2df1b3440d2a82cc3571db211b4ffdfa2b89ccc910759e8d5e9387fb62971b5c
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: recipe
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: penpot-backend-jar-${{ github.run_id }}
          path: output
      - name: Runtime platform and source admission
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(df --output=avail -B1 . | tail -1)" -ge 8000000000
          test "$(awk '/MemTotal/{print $2}' /proc/meminfo)" -ge 6000000
          sha256sum -c output/artifact-hashes.sha256
          test "$(cat output/studio-source.txt)" = "$SOURCE_SHA"
          test "$(cat output/recipe-source.txt)" = "$(git -C recipe rev-parse HEAD)"
          docker pull --platform linux/arm64 "$BASE"
          test "$(docker image inspect "$BASE" --format '{{.Os}}/{{.Architecture}}')" = linux/arm64
          docker image inspect "$BASE" > output/runtime-base.json
      - name: Assemble jar-only candidate and check Java26 namespace compatibility
        run: |
          set -euo pipefail
          mkdir context
          cp output/penpot.jar context/penpot.jar
          cp recipe/tools/penpot-backend-candidate/Dockerfile context/Dockerfile
          jar_sha=$(sha256sum context/penpot.jar | cut -d' ' -f1)
          recipe_sha=$(git -C recipe rev-parse HEAD)
          image="penpot-native-candidate:$GITHUB_RUN_ID"
          DOCKER_BUILDKIT=0 timeout --signal=TERM --kill-after=15s 120s docker build --platform linux/arm64 --network none --pull=false \
            --build-arg STUDIO_SOURCE="$SOURCE_SHA" --build-arg RECIPE_SOURCE="$recipe_sha" --build-arg JAR_SHA256="$jar_sha" \
            -t "$image" context 2>&1 | tee output/image-build.log
          docker image inspect "$image" > output/candidate-image.json
          name="penpot-candidate-smoke-$GITHUB_RUN_ID"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          timeout --signal=TERM --kill-after=15s 180s docker run --rm --name "$name" --network none \
            --read-only --tmpfs /tmp:size=64m --memory 1536m --memory-swap 1536m --cpus 2 \
            --cap-drop ALL --security-opt no-new-privileges --entrypoint /bin/bash "$image" -c '
              set -euo pipefail
              test -z "${STUDIO_NATIVE_ACCESS_CONFIG:-}"
              mkdir -p /tmp/penpot
              "$JAVA_HOME/bin/java" -version 2>&1 | tee /tmp/java-version
              grep -q "26.0.2" /tmp/java-version
              exec "$JAVA_HOME/bin/java" -Xmx1024m --sun-misc-unsafe-memory-access=allow --enable-native-access=ALL-UNNAMED \
                --enable-preview -Dlog4j2.configurationFile=log4j2.xml -jar penpot.jar -e \
                "(require '\''app.main '\''app.rpc '\''app.http.websocket '\''app.http.assets '\''app.studio.access '\''app.studio.live '\''app.studio.configuration '\''app.studio.assets '\''app.studio.http-authority '\''app.rpc.commands.studio-access) (println :java26-native-candidate-namespaces-loaded) (shutdown-agents)"
            ' 2>&1 | tee output/java26-namespace-smoke.log
          timeout --signal=TERM --kill-after=15s 180s bash -o pipefail -c 'docker save "$1" | gzip -1 > "$2"' _ "$image" output/candidate-image.tar.gz
          test "$(stat -c %s output/candidate-image.tar.gz)" -le 2147483648
          sha256sum output/candidate-image.tar.gz > output/candidate-image.sha256
          printf 'No listener, database, private access configuration, native activation, public push or deployment.\n' > output/acceptance-limits.txt
          python3 recipe/tools/penpot-backend-candidate/record-artifact.py output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: penpot-arm64-candidate-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: error
