    steps:
      - name: Refuse legacy plaintext artifact path
        run: |
          echo "This legacy entry is disabled. Use penpot-redis-runtime-artifact.yml for encrypted JAR/exporter delivery, or the reviewed encrypted AMD64 candidate workflow." >&2
          exit 1
