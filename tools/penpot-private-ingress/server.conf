# Official Penpot 2.18.3 server.d override. Local filesystem storage only.
# Mount on the EXISTING owned frontend after review; no backend/image fork.
location = /__studio_native_ingress_marker {
    default_type text/plain;
    add_header X-Studio-Native-Ingress "1" always;
    add_header Cache-Control "no-store" always;
    return 200 "studio-native-private-fs-v1\n";
}

location = /__studio_native_asset_authorize {
    internal;
    access_log off;
    proxy_pass http://host.docker.internal:39038/api/internal/penpot-asset-authorize;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host "localhost:39038";
    proxy_set_header X-Studio-Native-Path $request_uri;
    proxy_set_header X-Studio-Native-Session $http_cookie;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Origin "";
    proxy_cache off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
}

location = /assets { return 404; }
location ^~ /assets/ {
    auth_request /__studio_native_asset_authorize;
    proxy_set_header Host $proxy_host;
    proxy_pass http://penpot-backend:6060;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_hide_header Cache-Control;
    proxy_hide_header Location;
    proxy_hide_header X-Host;
    proxy_intercept_errors on;
    error_page 301 302 303 307 308 =502 /__studio_native_asset_unavailable;
    add_header Cache-Control "private, no-store" always;
    add_header Vary "Cookie" always;
}

location = /__studio_native_asset_unavailable {
    internal;
    add_header Cache-Control "private, no-store" always;
    return 502;
}

# Backend filesystem delivery uses X-Accel-Redirect. Direct external access to
# this location remains forbidden, and final response headers forbid caching.
location ^~ /internal/assets/ {
    internal;
    alias /opt/data/assets/;
    include /etc/nginx/nginx-security-headers.conf;
    add_header Cache-Control "private, no-store" always;
    add_header Vary "Cookie" always;
}

# The native UI keeps its original synchronous single-export request. The
# candidate validates its exact pinned DTO, current owner/file/source, then
# registers only the real returned tempfile. No arbitrary by-id exception.
location = /api/export {
    limit_except POST { deny all; }
    client_max_body_size 8k;
    client_body_timeout 5s;
    proxy_pass http://host.docker.internal:39038/api/internal/penpot-native-export;
    proxy_set_header Host "localhost:39038";
    proxy_set_header X-Studio-Native-Session $http_cookie;
    proxy_set_header X-Studio-Native-Origin $http_origin;
    proxy_set_header X-Studio-Export-Relay "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Origin "";
    proxy_cache off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 150s;
    add_header Cache-Control "private, no-store" always;
}
# Reject suffix aliases of the upstream prefix route.
location ~ "^/api/export." { return 404; }

location = /__studio_native_export_authorize {
    internal;
    access_log off;
    proxy_pass http://host.docker.internal:39038/api/internal/penpot-export-relay-authorize;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host "localhost:39038";
    proxy_set_header X-Studio-Native-Session $http_cookie;
    proxy_set_header X-Studio-Export-Relay $http_x_studio_export_relay;
    proxy_set_header X-Studio-Export-Method $studio_export_method;
    proxy_set_header X-Studio-Export-Path $request_uri;
    proxy_set_header X-Studio-Export-Content-Type $http_content_type;
    proxy_set_header X-Studio-Export-Body-Sha256 $http_x_studio_export_body_sha256;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Origin "";
    proxy_cache off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
}

location = /__studio_native_export {
    limit_except POST { deny all; }
    access_log off;
    set $studio_export_method $request_method;
    auth_request /__studio_native_export_authorize;
    auth_request_set $studio_export_body $upstream_http_x_studio_export_body;
    # Replace, rather than trust, the caller's body with the server-issued DTO.
    proxy_set_body $studio_export_body;
    proxy_set_header Content-Type "application/transit+json";
    proxy_set_header Host $proxy_host;
    proxy_set_header Authorization "";
    proxy_set_header Origin "http://localhost:39008";
    proxy_set_header X-Studio-Export-Relay "";
    proxy_set_header X-Studio-Export-Body-Sha256 "";
    proxy_pass http://penpot-exporter:6061/api/export;
    proxy_cache off;
    proxy_read_timeout 100s;
    add_header Cache-Control "private, no-store" always;
}

# A pending output is readable ONLY by this single-use server probe. The normal
# /assets registry does not admit it until bytes/hash/current authority pass.
location ~ "^/__studio_native_export_output/(?<studio_export_object>[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12})$" {
    limit_except GET { deny all; }
    access_log off;
    set $studio_export_method $request_method;
    auth_request /__studio_native_export_authorize;
    proxy_set_header Host $proxy_host;
    proxy_set_header Authorization "";
    proxy_set_header X-Studio-Export-Relay "";
    rewrite ^ /assets/by-id/$studio_export_object break;
    proxy_pass http://penpot-backend:6060;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_hide_header Cache-Control;
    proxy_hide_header Location;
    proxy_hide_header X-Host;
    proxy_intercept_errors on;
    error_page 301 302 303 307 308 =502 /__studio_native_asset_unavailable;
    add_header Cache-Control "private, no-store" always;
    add_header Vary "Cookie" always;
}
