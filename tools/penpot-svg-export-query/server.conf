# Penpot ff7a66f / 2.18.3 SVG exporter compatibility only.
# Include at server scope through the existing overrides/server.d/*.conf hook.
# exporter/src/app/renderer/svg.cljs sends render-embed=true, while the existing
# frontend/src/app/render.cljs renderer consumes embed=true. A browser-visible
# redirect is required: an internal rewrite cannot change location.search.
# Preserve the complete native file/page/object query and existing proxy/access
# handling. Explicit embed= choices are untouched, preventing redirect loops.
if ($request_uri ~ "^(?=/render[.]html[?])(?=.*[?&]render-embed=true(?:&|$))(?!.*[?&]embed=).+$") {
    return 302 "$request_uri&embed=true";
}
